<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Riwayat Transaksi Harian dan Ekspor PDF">
    <title>Riwayat — Angkringan Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); background: var(--color-surface-2); padding: 4px; border-radius: var(--radius-md); }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--color-text-muted); font-size: var(--font-size-xs); font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--color-surface); color: var(--color-primary); box-shadow: var(--shadow-sm); }
        .riwayat-group { margin-bottom: var(--space-5); }
        .riwayat-date-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); margin-bottom: var(--space-2); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="page-wrapper">

    <!-- PAGE HEADER -->
    <header class="page-header">
        <h1 class="page-header-title">Riwayat Transaksi</h1>
        <button id="btn-export-pdf" class="btn btn-primary btn-sm" style="display:flex;gap:4px;align-items:center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
            Cetak
        </button>
    </header>

    <!-- CONTENT -->
    <main class="content-area" style="padding-bottom: calc(var(--bottom-nav-h) + 24px);">

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-hari-ini">Hari Ini</button>
            <button class="tab-btn" id="tab-3-hari">Riwayat 3 Hari</button>
        </div>

        <!-- VIEW: HARI INI -->
        <div id="view-hari-ini">
            <div id="riwayat-list" style="display:flex;flex-direction:column;gap:var(--space-2);">
                <div class="empty-state">
                    <p class="text-muted text-sm">Memuat riwayat...</p>
                </div>
            </div>
        </div>

        <!-- VIEW: 3 HARI -->
        <div id="view-3-hari" class="hidden">
            <div id="laporan-riwayat-list" style="display:flex;flex-direction:column;gap:var(--space-4);">
                <!-- Rendered by JS -->
            </div>
        </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav" aria-label="Navigasi utama">
        <a href="dashboard.html" class="nav-item" id="nav-dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Dashboard
        </a>
        <a href="antrian.html" class="nav-item" id="nav-antrian">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
            Antrian
        </a>
        <a href="menu.html" class="nav-item" id="nav-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3h18v4H3z"/><path d="M3 9h18v12H3z"/>
            </svg>
            Menu
        </a>
        <a href="riwayat.html" class="nav-item active" id="nav-riwayat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="12 8 12 12 14 14"/>
                <circle cx="12" cy="12" r="10"/>
            </svg>
            Riwayat
        </a>
    </nav>

</div>

<!-- ====== MODAL DETAIL PESANAN ====== -->
<div class="modal-overlay" id="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="detail-modal-title">Detail Transaksi</h2>
            <button class="modal-close" id="btn-close-detail" aria-label="Tutup">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div id="detail-content" style="font-size:var(--font-size-sm);color:var(--color-text);"></div>
    </div>
</div>

<script type="module">
    import { requireAuth } from '../js/auth.js';
    import LaporanManager from '../js/laporan.js';
    import { escHtml, formatRupiah, showToast, openModal, closeModal } from '../js/utils.js';

    if (!requireAuth()) throw new Error('Not authenticated');

    let riwayatList = [];

    /* ===== Hari Ini ===== */
    function loadHariIni() {
        const data = LaporanManager.getDataHariIni();
        riwayatList = data;
        const container = document.getElementById('riwayat-list');

        if (data.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polyline points="12 8 12 12 14 14"/><circle cx="12" cy="12" r="10"/>
                    </svg>
                    <p>Belum ada transaksi hari ini.</p>
                </div>`;
            return;
        }

        const totalHariIni = data.reduce((s, i) => s + i.total_harga, 0);

        container.innerHTML = `
            <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3);display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-muted);">Total Hari Ini</div>
                    <div style="font-size:20px;font-weight:800;color:var(--color-primary);">${formatRupiah(totalHariIni)}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:12px;color:var(--color-text-muted);">${data.length} Transaksi</div>
                </div>
            </div>
            ${data.map((item, idx) => `
                <div class="card" style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);cursor:pointer;" data-idx="${idx}">
                    <div style="width:36px;height:36px;border-radius:var(--radius-sm);background:var(--color-success-dim);color:var(--color-success);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:600;font-size:var(--font-size-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--color-text);">${escHtml(item.nama_customer)}</div>
                        <div style="font-size:11px;color:var(--color-text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(item.daftar_pesanan)}</div>
                    </div>
                    <div style="font-weight:700;font-size:var(--font-size-sm);color:var(--color-success);white-space:nowrap;">${formatRupiah(item.total_harga)}</div>
                </div>`).join('')}`;

        container.querySelectorAll('[data-idx]').forEach(el => {
            el.addEventListener('click', () => showDetail(parseInt(el.dataset.idx)));
        });
    }

    function showDetail(idx) {
        const item = riwayatList[idx];
        if (!item) return;

        document.getElementById('detail-content').innerHTML = `
            <div style="margin-bottom:16px;padding:12px;background:var(--color-surface-2);border-radius:var(--radius-sm);">
                <div style="margin-bottom:6px;font-size:13px;"><strong>Pelanggan:</strong> ${escHtml(item.nama_customer)}</div>
                <div style="margin-bottom:6px;font-size:13px;"><strong>Metode Pembayaran:</strong> ${item.metodePembayaran || '-'}</div>
                <div style="font-size:13px;"><strong>Tanggal:</strong> ${item.createdAt}</div>
            </div>
            <div style="font-weight:600;margin-bottom:8px;font-size:13px;">Pesanan:</div>
            <div style="font-size:13px;color:var(--color-text-muted);line-height:1.7;padding-bottom:16px;border-bottom:1px dashed var(--color-border);">${escHtml(item.daftar_pesanan)}</div>
            <div style="display:flex;justify-content:space-between;margin-top:16px;font-weight:700;font-size:var(--font-size-md);color:var(--color-primary);">
                <span>Total</span>
                <span>${formatRupiah(item.total_harga)}</span>
            </div>`;
        openModal('detail');
    }

    /* ===== Riwayat 3 Hari ===== */
    function loadLaporanRiwayat() {
        const container = document.getElementById('laporan-riwayat-list');
        const groupedData = LaporanManager.getDataRiwayat();
        const dates = Object.keys(groupedData).sort().reverse();

        if (dates.length === 0) {
            container.innerHTML = `<div class="empty-state"><p>Belum ada riwayat dalam 3 hari terakhir.</p></div>`;
            return;
        }

        container.innerHTML = dates.map(date => {
            const items = groupedData[date];
            const dailyTotal = items.reduce((s, i) => s + i.total_harga, 0);
            return `
                <div class="riwayat-group">
                    <div class="riwayat-date-header">
                        <span>${date}</span>
                        <span style="color:var(--color-primary);font-weight:700;">${formatRupiah(dailyTotal)}</span>
                    </div>
                    ${items.map(i => `
                        <div class="card" style="padding:var(--space-3);margin-bottom:var(--space-2);">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <div style="font-weight:600;font-size:var(--font-size-sm);">${escHtml(i.nama_customer)}</div>
                                <div style="font-weight:700;font-size:var(--font-size-sm);color:var(--color-success);">${formatRupiah(i.total_harga)}</div>
                            </div>
                            <div style="font-size:11px;color:var(--color-text-muted);margin-top:3px;">${escHtml(i.daftar_pesanan)}</div>
                        </div>`).join('')}
                </div>`;
        }).join('');
    }

    /* ===== Cetak / Print ===== */
    document.getElementById('btn-export-pdf').addEventListener('click', () => {
        const data = LaporanManager.getDataHariIni();
        if (data.length === 0) { showToast('Tidak ada data hari ini untuk dicetak.', 'error'); return; }

        const total = data.reduce((s, i) => s + i.total_harga, 0);
        const tanggal = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        const rows = data.map(i => `
            <tr>
                <td>${escHtml(i.nama_customer)}</td>
                <td>${escHtml(i.daftar_pesanan)}</td>
                <td>${escHtml(i.metodePembayaran || '-')}</td>
                <td style="text-align:right;font-weight:600;">Rp ${i.total_harga.toLocaleString('id-ID')}</td>
            </tr>`).join('');

        const win = window.open('', '_blank');
        win.document.write(`<!DOCTYPE html><html><head><title>Laporan Harian — Angkringan</title>
            <style>
                body { font-family: 'Segoe UI', sans-serif; padding: 32px; font-size: 13px; color: #111; line-height: 1.6; }
                h2 { margin-bottom: 4px; font-size: 18px; }
                p { color: #666; margin-bottom: 24px; }
                table { width: 100%; border-collapse: collapse; margin-top: 8px; }
                th, td { border: 1px solid #e5e7eb; padding: 16px 20px; text-align: left; vertical-align: top; }
                th { background: #f9f9f6; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
                tfoot td { font-weight: 700; background: #f3f4f6; }
            </style></head><body>
            <h2>Laporan Transaksi Harian</h2>
            <p>${tanggal}</p>
            <table>
                <thead><tr><th>Pelanggan</th><th>Pesanan</th><th>Pembayaran</th><th>Total</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot><tr><td colspan="3">Total Pendapatan</td><td style="text-align:right;">Rp ${total.toLocaleString('id-ID')}</td></tr></tfoot>
            </table>
            </body></html>`);
        win.document.close();
        win.print();
    });

    /* ===== Modal ===== */
    document.getElementById('btn-close-detail').addEventListener('click', () => closeModal('detail'));
    document.getElementById('detail-overlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeModal('detail');
    });

    /* ===== Tabs ===== */
    document.getElementById('tab-hari-ini').addEventListener('click', () => {
        document.getElementById('tab-hari-ini').classList.add('active');
        document.getElementById('tab-3-hari').classList.remove('active');
        document.getElementById('view-hari-ini').classList.remove('hidden');
        document.getElementById('view-3-hari').classList.add('hidden');
    });

    document.getElementById('tab-3-hari').addEventListener('click', () => {
        document.getElementById('tab-3-hari').classList.add('active');
        document.getElementById('tab-hari-ini').classList.remove('active');
        document.getElementById('view-3-hari').classList.remove('hidden');
        document.getElementById('view-hari-ini').classList.add('hidden');
        loadLaporanRiwayat();
    });

    /* ===== Init ===== */
    loadHariIni();
</script>

</body>
</html>
