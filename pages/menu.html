<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Manajemen menu makanan dan minuman angkringan">
    <title>Menu — Angkringan Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

<div class="page-wrapper">

    <!-- PAGE HEADER -->
    <header class="page-header">
        <h1 class="page-header-title">Manajemen Menu</h1>
    </header>

    <!-- MENU LIST -->
    <main class="content-area" style="padding-top: var(--space-4); padding-bottom: calc(var(--bottom-nav-h) + 32px);">
        <div id="menu-list">
            <div class="empty-state">
                <p class="text-muted text-sm">Memuat menu...</p>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav" aria-label="Navigasi utama">
        <a href="dashboard.html" class="nav-item" id="nav-dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Dashboard
        </a>
        <a href="antrian.html" class="nav-item" id="nav-antrian">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
            Antrian
        </a>
        <a href="menu.html" class="nav-item active" id="nav-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3h18v4H3z"/><path d="M3 9h18v12H3z"/>
            </svg>
            Menu
        </a>
        <a href="riwayat.html" class="nav-item" id="nav-riwayat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="12 8 12 12 14 14"/>
                <circle cx="12" cy="12" r="10"/>
            </svg>
            Riwayat
        </a>
    </nav>

</div>

<!-- ====== MODAL EDIT HARGA ====== -->
<div class="modal-overlay" id="price-edit-overlay" role="dialog" aria-modal="true" aria-labelledby="price-edit-title">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="price-edit-title">Edit Harga</h2>
            <button class="modal-close" id="btn-close-price-modal" aria-label="Tutup">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- Input fields diisi secara dinamis oleh JS -->
        <div id="price-edit-fields"></div>

        <button id="btn-save-prices" class="btn btn-primary btn-full" style="margin-top: 20px;">
            Simpan Perubahan
        </button>
    </div>
</div>

<script type="module">
    import { requireAuth } from '../js/auth.js';
    import { loadMenus } from '../js/menu.js';

    if (!requireAuth()) throw new Error('Not authenticated');

    await loadMenus();

    // Tutup modal jika klik overlay
    document.getElementById('price-edit-overlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
    });
    document.getElementById('btn-close-price-modal').addEventListener('click', () => {
        document.getElementById('price-edit-overlay').classList.remove('open');
    });
</script>

</body>
</html>
